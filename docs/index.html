<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COIN BOARD — 실시간 추천 전광판</title>
<meta name="description" content="업비트 실시간 시세를 받아 추천 종목을 전광판으로 표시합니다.">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
</head>
<body>

<div class="scanlines" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="logo">▚</span>
    <span class="brand-name">COIN<em>BOARD</em></span>
    <span class="brand-sub">UPBIT KRW · LIVE</span>
  </div>
  <div class="status">
    <span class="conn" id="conn" data-state="connecting">
      <i class="dot"></i><span id="conn-label">연결 중</span>
    </span>
    <span class="clock" id="clock">--:--:--</span>
  </div>
</header>

<!-- 상단 실시간 시세 마퀴 -->
<section class="marquee-wrap" aria-label="실시간 시세">
  <div class="marquee-tag">LIVE</div>
  <div class="marquee" id="marquee-top"><div class="marquee-track" id="track-top"></div></div>
</section>

<main class="board">
  <div class="board-head">
    <div class="board-title">
      <h1>추천 종목</h1>
      <span class="board-meta" id="board-meta">스캔 정보 로딩 중…</span>
    </div>
    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab is-on" data-view="reco" role="tab">추천 TOP</button>
      <button class="tab" data-view="gainers" role="tab">실시간 급등</button>
      <button class="tab" data-view="turnover" role="tab">거래대금</button>
    </nav>
  </div>

  <div class="col-head" id="col-head">
    <span class="c-rank">#</span>
    <span class="c-name">종목</span>
    <span class="c-price">현재가</span>
    <span class="c-chg">24H</span>
    <span class="c-score">스코어 / 근거</span>
  </div>

  <div class="rows" id="rows">
    <div class="skeleton">데이터를 불러오는 중…</div>
  </div>
</main>

<!-- 하단 관심종목 마퀴 -->
<section class="marquee-wrap bottom" aria-label="관심 종목">
  <div class="marquee-tag alt">WATCH</div>
  <div class="marquee"><div class="marquee-track" id="track-bottom"></div></div>
</section>

<footer class="foot">
  <p class="disclaimer">
    본 페이지는 공개 시세 데이터를 기계적으로 가공한 <strong>정보 제공</strong> 화면입니다.
    투자 자문·권유가 아니며 매매 판단과 그 결과의 책임은 이용자 본인에게 있습니다.
  </p>
  <p class="src">시세 · 업비트 공개 API / WebSocket &nbsp;·&nbsp; 스코어링 <span id="foot-scan">—</span></p>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
